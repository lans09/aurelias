name: Daily Buffer Posts

on:
  schedule:
    # 8x daily (safe anti-shadowban ceiling): 07:00 to 21:00 every 2h Africa/Lagos (UTC+1)
    - cron: '0 6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Randomize posting minute (0-25m jitter)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1500))
          echo "Sleeping ${DELAY}s for randomized posting time..."
          sleep "$DELAY"

      - name: Generate fresh copy and image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.evmsync.live/' }}
        run: node scripts/generate-post.js

      - name: Publish generated image and post history to repo
        run: |
          if [ -n "$(git status --porcelain assets/social)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/social
            git commit -m "chore: update generated social visual and post history [skip ci]"
            git push
          fi

      - name: Send post directly to Buffer GraphQL API
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.evmsync.live/' }}
        run: node scripts/post-to-buffer.js
