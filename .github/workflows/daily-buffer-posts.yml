name: Daily Buffer Posts

on:
  schedule:
    # Runs once every morning at 06:00 Africa/Lagos (05:00 UTC) to pre-fill Buffer's Queue with 8 posts for the day
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate 8 fresh posts and images for today's queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.evmsync.live/' }}
        run: node scripts/generate-post.js --count 8

      - name: Publish generated image and post history to repo
        run: |
          if [ -n "$(git status --porcelain assets/social)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/social
            git commit -m "chore: update generated social visual and post history [skip ci]"
            git push
          fi

      - name: Send post directly to Buffer GraphQL API
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.evmsync.live/' }}
        run: node scripts/post-to-buffer.js
