name: Daily Buffer Posts

on:
  schedule:
    # 09:00, 14:00, and 20:00 Africa/Lagos (UTC+1)
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Randomize posting minute (0-45m jitter)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 2700))
          echo "Sleeping ${DELAY}s for randomized posting time..."
          sleep "$DELAY"

      - name: Generate fresh copy and image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.evmsync.live/' }}
        run: node scripts/generate-post.js

      - name: Publish generated image to repo for Buffer CDN
        run: |
          if [ -d "assets/social/generated" ] && [ -n "$(git status --porcelain assets/social/generated)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/social/generated
            git commit -m "chore: update generated social visual [skip ci]"
            git push
          fi

      - name: Send post directly to Buffer GraphQL API
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://www.evmsync.live/' }}
        run: node scripts/post-to-buffer.js
