name: Daily Buffer Posts

on:
  schedule:
    # 09:00, 14:00, and 20:00 Africa/Lagos (UTC+1)
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Randomize posting minute (0-45m jitter)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 2700))
          echo "Sleeping ${DELAY}s for randomized posting time..."
          sleep "$DELAY"

      - name: Send post to Buffer webhook
        env:
          BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/post-to-buffer.js
